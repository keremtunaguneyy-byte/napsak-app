name: Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NAPSAK_PRIVACY_POLICY_URL: ${{ vars.NAPSAK_PRIVACY_POLICY_URL }}
      NAPSAK_SUPPORT_URL: ${{ vars.NAPSAK_SUPPORT_URL }}
      NAPSAK_RESTORE_DRILL_EVIDENCE: ${{ vars.NAPSAK_RESTORE_DRILL_EVIDENCE }}
      NAPSAK_DEVICE_MATRIX_EVIDENCE: ${{ vars.NAPSAK_DEVICE_MATRIX_EVIDENCE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Strict release readiness
        run: npm run check:release:strict
