name: Security Rules

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/firestore.rules.test.cjs'
      - '.github/workflows/security-rules.yml'
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/firestore.rules.test.cjs'
      - '.github/workflows/security-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact dependencies
        run: npm ci
      - name: Test Firestore Security Rules
        run: npm run test:rules
